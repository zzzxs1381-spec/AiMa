[project]
name = "proxy-sub"
version = "2.0.0"
description = "Proxy Subscription Service for Hiddify - API + Telegram Bot + WebApp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "aiogram>=3.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
